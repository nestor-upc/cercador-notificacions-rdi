name: Actualitza les notificacions

on:
  schedule:
    - cron: "17 5 * * *"   # cada dia cap a les 6-7 h (hora de Barcelona)
  workflow_dispatch:        # permet executar-lo a mà des de la pestanya Actions

permissions:
  contents: write

jobs:
  actualitza:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Llegeix Gennews i genera el JSON
        run: python scraper/scrape.py
      - name: Desa els canvis si n'hi ha
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          # El camp "actualitzat" canvia sempre: només desem si canvia la llista de notificacions
          if git cat-file -e HEAD:docs/notificacions.json 2>/dev/null && python3 -c "import json,subprocess,sys; a=json.loads(subprocess.check_output(['git','show','HEAD:docs/notificacions.json'])); b=json.load(open('docs/notificacions.json')); sys.exit(0 if a['notificacions']==b['notificacions'] else 1)"; then
            echo "Cap notificació nova: no es desa res."
            git checkout -- docs/notificacions.json
          else
            git add docs/notificacions.json
            git commit -m "Actualitza notificacions ($(date -u +%Y-%m-%d))"
            git push
          fi
